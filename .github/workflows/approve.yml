# Adding the "approved" label to a submission issue adds the macro to
# index.json (which the fTools Community tab reads) and closes the issue.
name: Add approved macro

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  add:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const sections = {};
            for (const part of (issue.body || '').split(/^### /m).slice(1)) {
              const [title, ...rest] = part.split('\n');
              const value = rest.join('\n').trim();
              sections[title.trim()] = value === '_No response_' ? '' : value;
            }
            const name = (sections['Macro name'] || '').slice(0, 60);
            const description = (sections['Description'] || '').replace(/\s+/g, ' ').slice(0, 200);
            const code = (sections['Share code'] || '').replace(/\s+/g, '');

            if (!name || !/^ftm1\.[A-Za-z0-9_-]+$/.test(code) || code.length > 200000) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: 'This submission is missing a name or a valid share code (it should start with `ftm1.`), so it wasn\'t added.',
              });
              return;
            }

            const path = 'index.json';
            const { data: file } = await github.rest.repos.getContent({ ...context.repo, path });
            const index = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const id = String(issue.number);
            index.macros = (index.macros || []).filter((m) => m.id !== id);
            index.macros.push({
              id,
              name,
              author: issue.user.login,
              description,
              code,
              added: new Date().toISOString().slice(0, 10),
            });
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              sha: file.sha,
              message: `Add macro #${id}: ${name}`,
              content: Buffer.from(JSON.stringify(index, null, 2) + '\n').toString('base64'),
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: `Thanks! “${name}” is now in the fTools Community tab.`,
            });
            await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
